name: Test

on:
  push:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test default GPU-enabled build
        run: cargo test --locked --all-features

      - name: Test CPU-only build
        run: cargo test --locked --no-default-features

  quality:
    name: Formatting and clippy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.87 with lint components
        uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint default GPU-enabled build
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Lint CPU-only build
        run: cargo clippy --locked --all-targets --no-default-features -- -D warnings

  interactive-smoke:
    name: Interactive Foundry smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust 1.87
        uses: dtolnay/rust-toolchain@1.87.0

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install expect
        run: sudo apt-get update && sudo apt-get install --yes expect

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build vanity
        run: cargo build --locked --bin vanity

      - name: Exercise the interactive CLI
        run: expect tests/interactive-smoke.exp

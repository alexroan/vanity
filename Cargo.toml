[package]
name = "vanity-create2"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Interactive CREATE2 vanity address miner for Foundry projects"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vanity"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ctrlc = "3.4"
dialoguer = "0.11"
ethabi = { version = "18.0", default-features = false, features = ["serde", "std"] }
hex = "0.4"
indicatif = "0.17"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[dev-dependencies]
tempfile = "3.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

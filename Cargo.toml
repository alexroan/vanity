[package]
name = "vanity"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Interactive CREATE2 vanity address miner for Foundry projects"
license = "MIT OR Apache-2.0"

[[bin]]
name = "vanity"
path = "src/main.rs"

[[bench]]
name = "throughput"
harness = false

[features]
default = ["gpu"]
gpu = ["dep:bytemuck", "dep:pollster", "dep:wgpu"]

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.23", features = ["derive"], optional = true }
ctrlc = "3.4"
dialoguer = "0.11"
ethabi = { version = "18.0", default-features = false, features = ["full-serde", "std"] }
hex = "0.4"
indicatif = "0.17"
pollster = { version = "0.4", optional = true }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["metal", "std", "wgsl"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["std", "vulkan", "wgsl"], optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64"))'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["dx12", "static-dxc", "std", "wgsl"], optional = true }

[target.'cfg(all(target_os = "windows", not(target_arch = "x86_64")))'.dependencies]
wgpu = { version = "30.0", default-features = false, features = ["dx12", "std", "wgsl"], optional = true }

[dev-dependencies]
naga = { version = "30.0", features = ["hlsl-out", "msl-out", "spv-out", "wgsl-in"] }
tempfile = "3.17"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
